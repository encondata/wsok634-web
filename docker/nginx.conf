server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/wsok634;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
